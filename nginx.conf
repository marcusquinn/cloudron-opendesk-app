#
# The one HTTP port Cloudron proxies to (8000), replacing upstream's Caddy:
#   /socket, /socket/*  -> realtime gateway 127.0.0.1:4000 (Phoenix WebSockets)
#   everything else     -> opendesk 127.0.0.1:8080 (API, web app, widget, help
#                          center, admin panel at /admin/)
# Cloudron's nginx terminates TLS and sets X-Forwarded-*; those headers pass
# through unchanged so the client address stays one hop from the right.

user cloudron;
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log off;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	client_body_temp_path /run/nginx/client-body;
	proxy_temp_path /run/nginx/proxy;
	fastcgi_temp_path /run/nginx/fastcgi;
	scgi_temp_path /run/nginx/scgi;
	uwsgi_temp_path /run/nginx/uwsgi;

	# Attachments and imports; opendesk enforces its own per-file limits.
	client_max_body_size 100m;

	# WebSocket upgrades pass through; everything else keeps upstream keepalive.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' '';
	}

	upstream opendesk {
		server 127.0.0.1:8080;
		keepalive 16;
	}

	upstream realtime {
		server 127.0.0.1:4000;
	}

	server {
		listen 8000 default_server;
		listen [::]:8000 default_server;

		proxy_http_version 1.1;
		# Every proxy_set_header lives here, never in a location: a location
		# with any proxy_set_header of its own drops all of these, and opendesk
		# then sees the upstream name as Host and serves no help center.
		proxy_set_header Host $http_host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		# Only Cloudron's proxy is the edge: client-supplied edge headers are lies.
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header True-Client-IP "";

		location = /socket {
			proxy_pass http://realtime;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
			proxy_buffering off;
		}

		location /socket/ {
			proxy_pass http://realtime;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
			proxy_buffering off;
		}

		location / {
			proxy_pass http://opendesk;
			# Server-sent events and long polls.
			proxy_buffering off;
			proxy_read_timeout 5m;
		}
	}
}
