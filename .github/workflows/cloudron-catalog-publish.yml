name: Publish Cloudron Catalog

# Managed caller. Publication requires CLOUDRON_PUBLICATION_ENABLED=true;
# PRs validate and build without publishing. See docs/PUBLISHING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@802af9312d1f966bb1c63f6b532283304367e6e9
    with:
      aidevops_ref: 802af9312d1f966bb1c63f6b532283304367e6e9
      image_repository: ghcr.io/marcusquinn/cloudron-opendesk-app
      cli_version: '8.2.6'
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
      package_checks: |
        bash test/package-test.sh
        shellcheck -x start.sh bin/run-realtime bin/opendesk-cli scripts/*.sh test/*.sh
        commit="$(sed -n 's/^ARG OPENDESK_COMMIT=//p' Dockerfile)"
        src="${RUNNER_TEMP}/opendesk"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 https://github.com/useopendesk/opendesk.git "$commit"
        git -C "$src" checkout -q FETCH_HEAD
        test "$(git -C "$src" rev-parse HEAD)" = "$commit"
        for p in patches/*.patch; do git -C "$src" apply --recount --check "$PWD/$p"; git -C "$src" apply --recount "$PWD/$p"; done
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
