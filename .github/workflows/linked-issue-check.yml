name: Linked Issue Check

# Metadata-only caller; never checks out PR-head code.
permissions:
  issues: read
  pull-requests: read
  statuses: write

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    uses: marcusquinn/aidevops/.github/workflows/linked-issue-check-reusable.yml@f5ac0cecd63b315a7409ed492216bb6a153b94a3
