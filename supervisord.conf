;
; opendesk (API, workers, web app, embedded NATS), the realtime gateway and the
; internal nginx on :8000. Every program inherits the environment start.sh built.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[program:opendesk]
command=/app/code/opendesk serve
directory=/app/data
user=cloudron
environment=HOME="/app/data"
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Waits for the embedded NATS (started by opendesk) before the gateway connects.
[program:realtime]
command=/app/code/bin/run-realtime
directory=/run/realtime
user=cloudron
environment=HOME="/run/realtime"
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /app/code/nginx.conf -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
